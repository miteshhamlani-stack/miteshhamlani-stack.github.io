name: Deploy SBISIF Apps Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          cname: apps.sbisif.com
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: document-reconciler-app/package-lock.json
      - name: Install Document Reconciler dependencies
        run: npm ci --prefix document-reconciler-app
      - name: Build Document Reconciler
        run: npm run build --prefix document-reconciler-app
      - name: Assemble Pages artifact
        run: |
          mkdir -p pages-dist/document-reconciler
          cp index.html CNAME .nojekyll sbisif-logo.png pages-dist/
          cp -R document-reconciler-app/dist/. pages-dist/document-reconciler/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
